<!DOCTYPE html>
<html lang="nl" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8">
  <title>Presentatie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: "#4ade80",
            dark: "#1f2937",
          },
        },
      },
    };
  </script>
  <style>
    .toggle-checkbox:checked + .toggle-label .ball {
      transform: translateX(1.5rem);
    }
  </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-white font-sans transition">

  <div class="fixed top-4 right-4 z-50">
    <div class="flex items-center gap-2 bg-white dark:bg-gray-700 shadow-md px-3 py-1 rounded-full transition-colors">
      <span class="text-sm">🌞</span>
      <input type="checkbox" id="darkToggle" class="hidden toggle-checkbox" />
      <label for="darkToggle" class="toggle-label w-12 h-6 bg-gray-300 dark:bg-gray-600 rounded-full flex items-center px-1 cursor-pointer relative">
        <div class="ball w-4 h-4 bg-primary rounded-full transition-transform duration-300"></div>
      </label>
      <span class="text-sm">🌙</span>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-6 py-16">
    <h1 class="text-3xl font-bold text-center mb-10">📊 Presentatie: Healthy Meal Planner</h1>

    <div class="flex justify-center overflow-auto">
      <iframe 
        src="https://docs.google.com/presentation/d/e/2PACX-1vSQx5D_AyRpoX6aEaL46ojm3GOu8lR4pyrSge0w9qtMk9Ols0nSIOfTUWQo-8-BbxHdoA5zG4HEB_Jk/pubembed?start=false&loop=false&delayms=10000" 
        frameborder="0" 
        width="1440" 
        height="839" 
        allowfullscreen 
        mozallowfullscreen 
        webkitallowfullscreen 
        class="rounded shadow-lg w-full max-w-full"
      ></iframe>
    </div>

    <div class="flex justify-center gap-4 mt-10">
      <a href="index-teamwebsite.html" class="px-4 py-2 bg-primary text-white rounded hover:bg-green-600 transition">🏠 Home</a>
      <a href="gitlog.html" class="px-4 py-2 bg-primary text-white rounded hover:bg-green-600 transition">📜 Git Log</a>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-6 mt-12">
  <p class="mb-4">Gemaakt door Yorbe en Jonas 💪 | &copy; 2025 Healthy Meal Planner</p>
  <a 
    href="https://github.com/Yorb1431/HealthyMealPlanner" 
    target="_blank" 
    aria-label="Bekijk de GitHub repository"
    class="inline-block"
  >
    <svg 
      xmlns="http://www.w3.org/2000/svg" 
      viewBox="0 0 24 24" 
      fill="currentColor" 
      class="w-8 h-8 mx-auto text-white hover:text-primary transition"
    >
      <path 
        fill-rule="evenodd" 
        d="M12 0C5.373 0 0 5.373 0 12c0 5.303 3.438 9.8 8.205 11.387.6.113.82-.26.82-.577 0-.285-.01-1.04-.015-2.04-3.338.726-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.082-.729.082-.729 1.205.085 1.838 1.237 1.838 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.42-1.305.763-1.605-2.665-.303-5.467-1.332-5.467-5.93 0-1.31.467-2.38 1.235-3.22-.125-.303-.535-1.523.115-3.176 0 0 1.008-.322 3.3 1.23a11.5 11.5 0 0 1 3.005-.404c1.02.005 2.045.138 3.005.404 2.29-1.552 3.295-1.23 3.295-1.23.652 1.653.242 2.873.118 3.176.77.84 1.232 1.91 1.232 3.22 0 4.61-2.807 5.625-5.48 5.922.432.372.816 1.102.816 2.222 0 1.606-.014 2.898-.014 3.292 0 .32.216.694.825.576C20.565 21.796 24 17.3 24 12c0-6.627-5.373-12-12-12z" 
        clip-rule="evenodd"
      />
    </svg>
  </a>
</footer>


  <script>
    const toggle = document.getElementById("darkToggle");
    const html = document.documentElement;

    if (localStorage.getItem("theme") === "dark" || 
       (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      html.classList.add("dark");
      toggle.checked = true;
    }

    toggle?.addEventListener("change", () => {
      if (toggle.checked) {
        html.classList.add("dark");
        localStorage.setItem("theme", "dark");
      } else {
        html.classList.remove("dark");
        localStorage.setItem("theme", "light");
      }
    });
  </script>
</body>
</html>
